<!DOCTYPE html>
<html>
<head>
    <title>Resume Builder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Resume Builder</h1>

    <div class="form-container">

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label>Phone</label>
        <input type="text" id="phone" placeholder="Enter your phone">

        <label>Address</label>
        <input type="text" id="address" placeholder="Enter your address">

        <label>Career Objective</label>
        <textarea id="objective" placeholder="Enter your career objective"></textarea>

        <label>Education</label>
        <textarea id="education" placeholder="Enter your education"></textarea>

        <label>Skills</label>
        <textarea id="skills" placeholder="Enter your skills"></textarea>

        <label>Projects</label>
        <textarea id="projects" placeholder="Enter your projects"></textarea>

        <button onclick="generateResume()">Generate Resume</button>

    </div>

    <div id="resume">

        <h2 id="rname">Your Name</h2>

        <p id="rcontact"></p>
        <p id="raddress"></p>

        <h3>Career Objective</h3>
        <p id="robjective"></p>

        <h3>Education</h3>
        <p id="reducation"></p>

        <h3>Skills</h3>
        <p id="rskills"></p>

        <h3>Projects</h3>
        <p id="rprojects"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
